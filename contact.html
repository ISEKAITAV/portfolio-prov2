<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio của Trần Anh Vũ - Full-stack Developer tương lai">
    <title>Liên hệ - Trần Anh Vũ</title>
    <script>
        document.documentElement.classList.add('js');
        try {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="projects.html">Dự án</a>
        <a href="contact.html" aria-current="page">Liên hệ</a>
        <button id="theme-toggle" type="button" aria-pressed="false">🌙 Tối</button>
    </nav>

    <header>
        <h1>Liên hệ</h1>
        <p>Hãy kết nối với mình nhé!</p>
    </header>

    <main>
        <section>
            <h2 class="reveal">Gửi tin nhắn</h2>
            <!-- Thay YOUR_FORM_ID bằng mã form của bạn trên formspree.io -->
            <form class="card reveal" action="https://formspree.io/f/xwlowvzk" method="POST">
                <label>Họ và tên
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label>Email
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label>Nội dung
                    <textarea name="message" rows="6" required></textarea>
                </label>
                <button type="submit">Gửi tin nhắn</button>
            </form>

            <div class="card reveal">
                GitHub: <a href="https://github.com/ISEKAITAV" target="_blank" rel="noopener">github.com/ISEKAITAV</a>
            </div>
        </section>
    </main>
    <footer>&copy; 2026 Trần Anh Vũ</footer>

    <script src="js/script.js"></script>
</body>
</html>
